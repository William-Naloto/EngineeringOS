# EngineeringOS Routing Manifest
# Version: 0.1.1-RC1

version: "0.1.1-RC1"
os_version: "0.1.1"

taxonomy:
  domains:
    - engineering
    - fabric
    - platform
    - data
    - security
  artifact_types:
    - capability
    - skill
    - workflow
    - standard
    - agent
    - pack
    - template
  status:
    - draft
    - experimental
    - stable
    - deprecated
  confidence:
    - High
    - Medium
    - Low
    - Unknown

# Capability-first routing (ADR 0009)
# Rules match capabilities; orchestrated artifacts resolved automatically
routing_strategy: capability-first

rules:
  - id: route.review-pr
    match:
      triggers: [review PR, pull request, code review, PR review]
    load:
      capabilities: [capability.engineering.review-pr]
  - id: route.design-architecture
    match:
      triggers: [architecture design, system design, ADR, technical design]
    load:
      capabilities: [capability.engineering.design-architecture]
  - id: route.fabric-monitoring
    match:
      triggers: [fabric monitoring, fabric pipeline, new relic fabric]
    load:
      capabilities: [capability.fabric.monitoring]
  - id: route.platform-observability
    match:
      triggers: [observability, SLO, alerting, new relic dashboard]
    load:
      capabilities: [capability.platform.observability]
  - id: route.feature-store
    match:
      triggers: [feature store, ML features, unity catalog features]
    load:
      capabilities: [capability.data.feature-store]

defaults:
  max_capabilities_per_session: 3
  max_artifacts_per_session: 8
  prefer_capabilities_over_skills: true
  prefer_agents_with_capabilities: true
  require_explicit_trigger: false
  status_filter: experimental
  confidence_minimum: Low
  exclude_research: true
  exclude_lifecycle: [created]

resolution_order:
  - capability
  - agent
  - skill
  - workflow
  - standard

compilation:
  resolve_dependencies: true
  include_standards: true
  build_skill_graph: true

# Planned: indexes/artifacts.json as routing data source (ADR 0012)
index_source: manual
